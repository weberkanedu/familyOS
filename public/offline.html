<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>FamilyOS · Çevrimdışı</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #0b1020;
        color: #fff;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 420px; }
      .logo { font-size: 64px; margin-bottom: 8px; }
      h1 { font-size: 28px; margin: 0 0 8px; }
      p { color: #94a3b8; line-height: 1.6; margin: 0 0 24px; }
      button {
        background: #4f6ef7; color: #fff; border: 0; border-radius: 14px;
        padding: 14px 28px; font-size: 17px; font-weight: 700; cursor: pointer;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">🏠</div>
      <h1>Çevrimdışısınız</h1>
      <p>İnternet bağlantınız yok. Bağlantı geri geldiğinde FamilyOS otomatik olarak senkronize olur; verileriniz cihazda saklanmaya devam eder.</p>
      <button onclick="location.reload()">Tekrar dene</button>
    </div>
  </body>
</html>
